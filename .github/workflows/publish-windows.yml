name: Publish tested Windows release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows package workflow run ID
        required: true
        type: string
      source_sha:
        description: Exact tested source commit (40 characters)
        required: true
        type: string
      tag:
        description: Windows release tag (vX.Y.Z-windows.N)
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-windows-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - name: Verify and publish the already tested artifact
        env:
          WINDOWS_RUN_ID: ${{ inputs.run_id }}
          WINDOWS_SOURCE_SHA: ${{ inputs.source_sha }}
          WINDOWS_TAG: ${{ inputs.tag }}
        run: node scripts/publish-windows.js "$WINDOWS_RUN_ID" "$WINDOWS_SOURCE_SHA" "$WINDOWS_TAG"
