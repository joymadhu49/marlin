name: Publish tested Windows preview
on:
  push:
    branches: [release/windows-publish]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-windows-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      # Promotion is deliberately pinned. Change these together only after a
      # new Windows package run has completed successfully for that commit.
      - name: Verify and publish the already tested artifact
        run: node scripts/publish-windows.js 38051567154 dce7aef7bb07505b4a91e5d7dab6d5f2e49aebdd v0.3.0-windows.1
