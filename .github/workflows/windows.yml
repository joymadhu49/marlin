name: Windows package
on:
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'install.ps1'
      - 'marlin.cmd'
  push:
    branches: ['release/windows-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
            node_architecture: x64
            chromium_revision: '1716323'
          - architecture: arm64
            runner: windows-11-arm
            node_architecture: arm64
            chromium_revision: '1716310'
          - architecture: x86
            runner: windows-latest
            node_architecture: x86
            chromium_revision: '1716311'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      MARLIN_CHROMIUM_REVISION: ${{ matrix.chromium_revision }}
      MARLIN_WINDOWS_VERSION: '0.3.0-windows.3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          architecture: ${{ matrix.node_architecture }}
      - run: npm install --global pnpm@10.28.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run test:unit
      - name: Download pinned Chromium
        run: node src/cli.js fetch-chromium
      - name: Build portable Windows package
        run: ./scripts/build-windows.ps1 -Architecture ${{ matrix.architecture }}
      - name: Exercise the bundled runtime and browser
        env:
          MARLIN_APP_ROOT: ${{ github.workspace }}\dist\Marlin-win32-${{ matrix.architecture }}
        run: node test/windows-smoke.js
      - name: Upload tested package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marlin-windows-${{ matrix.architecture }}
          path: |
            dist/Marlin-*-windows-${{ matrix.architecture }}.zip
            dist/Marlin-*-windows-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
